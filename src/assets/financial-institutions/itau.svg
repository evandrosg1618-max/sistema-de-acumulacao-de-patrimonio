<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo quadrado arredondado laranja Itaú -->
  <rect width="512" height="512" rx="128" fill="#EC7000"/>
  <!-- Quadrilátero azul escuro central com cantos suaves -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="#001A88"/>
  <!-- Tipografia 'itaú' e acento característico -->
  <text x="256" y="295" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="124" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">itaú</text>
  <!-- Pingo amarelo ouro sobre o u -->
  <circle cx="340" cy="190" r="16" fill="#FED100"/>
</svg>
